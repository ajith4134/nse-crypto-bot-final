<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>ML Network Brain — Architecture</title>
<style>
  body{margin:0;background:#05070f;color:#cfe3ff;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .top{padding:14px 22px;border-bottom:1px solid #1d2b4a;background:#0a1020;}
  .top a{color:#39d0ff;text-decoration:none;font-size:13px;}
  h1{margin:0;font-size:18px;letter-spacing:1px;} h1 b{color:#39d0ff;}
  .legend{font-size:12px;color:#7d96c4;margin-top:6px;}
  svg{display:block;margin:0 auto;}
  text{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="top">
  <h1>🧠 ML NETWORK <b>BRAIN</b> — Full Architecture (models as neurons)</h1>
  <div class="legend">Each box is a NODE = a full model/project. Arrows = data/prediction flow. ← <a href="/">back to live dashboard</a></div>
</div>
<svg width="1100" height="900" viewBox="0 0 1100 900">
  <defs>
    <marker id="a" viewBox="0 -5 10 10" refX="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#2f5fae"/>
    </marker>
    <style>
      .lyr{fill:#9fc0ff;font-size:13px;letter-spacing:2px;}
      .box{rx:10;stroke-width:1.5;}
      .lbl{fill:#04101f;font-size:12px;font-weight:700;text-anchor:middle;}
      .sub{fill:#7d96c4;font-size:11px;text-anchor:middle;}
      .edge{stroke:#2f5fae;stroke-width:2;marker-end:url(#a);fill:none;}
      .brainedge{stroke:#ff5cf0;stroke-width:1.6;stroke-dasharray:5 4;fill:none;opacity:.8;}
    </style>
  </defs>

  <!-- edges: data -> features -> base -> meta -> output -->
  <g>
    <path class="edge" d="M170,150 L170,205"/><path class="edge" d="M390,150 L390,205"/>
    <path class="edge" d="M610,150 L610,205"/><path class="edge" d="M830,150 L830,205"/>
    <!-- feature bus to each base node -->
    <path class="edge" d="M500,250 L120,330"/><path class="edge" d="M500,250 L255,330"/>
    <path class="edge" d="M500,250 L390,330"/><path class="edge" d="M500,250 L525,330"/>
    <path class="edge" d="M500,250 L660,330"/><path class="edge" d="M500,250 L900,330"/>
    <!-- base nodes to meta/router -->
    <path class="edge" d="M120,390 L500,470"/><path class="edge" d="M255,390 L500,470"/>
    <path class="edge" d="M390,390 L500,470"/><path class="edge" d="M525,390 L500,470"/>
    <path class="edge" d="M660,390 L500,470"/><path class="edge" d="M900,390 L520,470"/>
    <!-- meta to output -->
    <path class="edge" d="M500,515 L500,585"/>
    <!-- brain controls router + reads memory -->
    <path class="brainedge" d="M870,560 C760,540 640,520 560,500"/>
    <path class="brainedge" d="M870,620 C700,660 600,660 520,610"/>
  </g>

  <!-- Layer 0: data sources -->
  <text class="lyr" x="40" y="60">LAYER 0 · DATA SOURCES</text>
  <g>
    <rect class="box" x="90"  y="100" width="160" height="50" fill="#39ffa6"/>
    <text class="lbl" x="170" y="122">CoinGecko</text><text class="sub" x="170" y="139">prices / OHLC (keyless)</text>
    <rect class="box" x="310" y="100" width="160" height="50" fill="#39ffa6"/>
    <text class="lbl" x="390" y="122">Coinalyze</text><text class="sub" x="390" y="139">funding / OI / liq (key)</text>
    <rect class="box" x="530" y="100" width="160" height="50" fill="#39ffa6"/>
    <text class="lbl" x="610" y="122">Etherscan</text><text class="sub" x="610" y="139">on-chain (key)</text>
    <rect class="box" x="750" y="100" width="160" height="50" fill="#39ffa6"/>
    <text class="lbl" x="830" y="122">Books / News</text><text class="sub" x="830" y="139">→ brain memory</text>
  </g>

  <!-- Layer 1: feature/data bus -->
  <text class="lyr" x="40" y="195">LAYER 1 · FEATURE &amp; DATA BUS + GOLDEN DATASETS</text>
  <rect class="box" x="300" y="208" width="500" height="44" fill="#2bd4ff"/>
  <text class="lbl" x="550" y="230">feature engineering · targets (direction / return / regime) · known I/O split</text>

  <!-- Layer 2: base node families -->
  <text class="lyr" x="40" y="300">LAYER 2 · BASE NODES (each = a full model/project)</text>
  <g>
    <rect class="box" x="55"  y="330" width="130" height="58" fill="#39ffa6"/><text class="lbl" x="120" y="356">logreg</text><text class="sub" x="120" y="373">linear</text>
    <rect class="box" x="195" y="330" width="120" height="58" fill="#39ffa6"/><text class="lbl" x="255" y="356">kNN</text><text class="sub" x="255" y="373">local</text>
    <rect class="box" x="330" y="330" width="120" height="58" fill="#39ffa6"/><text class="lbl" x="390" y="356">stump</text><text class="sub" x="390" y="373">tree split</text>
    <rect class="box" x="465" y="330" width="120" height="58" fill="#ffd166"/><text class="lbl" x="525" y="356">MLP</text><text class="sub" x="525" y="373">neural net</text>
    <rect class="box" x="600" y="330" width="120" height="58" fill="#ffd166"/><text class="lbl" x="660" y="356">reservoir</text><text class="sub" x="660" y="373">ESN/ELM</text>
    <rect class="box" x="840" y="330" width="120" height="58" fill="#ffd166"/><text class="lbl" x="900" y="356">gaussNB</text><text class="sub" x="900" y="373">probabilistic</text>
    <text class="sub" x="775" y="363" style="fill:#5f7bb0">… +reservoir/chaos/regime/quant/physics nodes →</text>
  </g>

  <!-- Layer 3: meta / router -->
  <text class="lyr" x="40" y="455">LAYER 3 · STACKING META / LEARNED ROUTER (the research frontier)</text>
  <rect class="box" x="380" y="470" width="240" height="46" fill="#ff5cf0"/>
  <text class="lbl" x="500" y="498">meta-learner · routes &amp; combines node outputs</text>

  <!-- Output -->
  <rect class="box" x="380" y="585" width="240" height="46" fill="#2bd4ff"/>
  <text class="lbl" x="500" y="607">PREDICTION → dashboard</text>

  <!-- Brain agent -->
  <text class="lyr" x="720" y="520" style="fill:#ff9cf3">BRAIN AGENT (outside)</text>
  <rect class="box" x="720" y="535" width="320" height="120" fill="#1a0f2e" stroke="#ff5cf0"/>
  <text x="740" y="560" style="fill:#ff9cf3;font-size:12px;">• reads books/news/PDF → memory</text>
  <text x="740" y="582" style="fill:#ff9cf3;font-size:12px;">• vector DB + temporal graph</text>
  <text x="740" y="604" style="fill:#ff9cf3;font-size:12px;">• learns how to wire/route nodes</text>
  <text x="740" y="626" style="fill:#ff9cf3;font-size:12px;">• proposes new nodes/equations</text>
  <text x="740" y="648" style="fill:#7d96c4;font-size:11px;">dashed = brain control + memory</text>

  <text x="40" y="760" style="fill:#5f7bb0;font-size:12px;">Green = live now · Yellow = added in Phase 2 · Pink = brain/router (Phase 3–4) · Cyan = bus/output</text>
  <text x="40" y="784" style="fill:#5f7bb0;font-size:12px;">This is the same graph the live dashboard renders — it grows as nodes are added (dashboard-sync).</text>
</svg>
</body>
</html>
